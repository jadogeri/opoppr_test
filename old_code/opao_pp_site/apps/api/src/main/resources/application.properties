# Tell Spring Boot to read your local .env file explicitly
spring.config.import=optional:file:.env[.properties]

spring.application.name=pp_api
server.port=9000

# Disable Docker Compose integration
spring.docker.compose.enabled=false 

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/opoppr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
