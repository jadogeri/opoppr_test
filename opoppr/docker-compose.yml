services:
  opoppr:
    depends_on:
      db:
        condition: service_healthy
    image: opoppr
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      opoppr-net:
    ports:
      - 8080:8080
    environment:
      OPOPPR_SCRIPTS: "/opoppr-scripts"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USERNAME: "opoppr"
      DB_PASSWORD: "opoppr"
      SEND_CONFIRMATION_EMAIL: "false"
    entrypoint: ["/bin/sh", "-c", "echo 'Waiting 15 seconds for database to stabilize...' && sleep 15 && /entrypoint.sh"]

  db:
    image: mysql:8.0.27
    networks:
      opoppr-net:
    ports:
      - 3386:3306
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: opoppr
    volumes:
      - ./database/initdb.d:/docker-entrypoint-initdb.d
      - ./database/conf.d:/etc/mysql/conf.d
      - db-data:/var/lib/mysql
    command: --lower_case_table_names=1 --default-authentication-plugin=mysql_native_password --local-infile
    healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
          interval: 5s
          timeout: 3s
          retries: 5    

networks:
  opoppr-net:

volumes:
  db-data:
