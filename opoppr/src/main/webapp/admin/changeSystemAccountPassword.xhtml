<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:o="http://opoppr.svlogic.com/ui" xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">Administration</ui:define>
        <ui:define name="content">
            <div>
                <div style="float: left;">
                    <h2>Change System Account Password</h2>
                </div>
                <div style="float: right"><a href="help.html" onclick="javascript:void window.open('help.html', '1359749959948', 'width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');
                                return false;">Help</a></div>
            </div>
            <h:form id="form" enctype="multipart/form-data" style="float: left; width: 100%">
                <p:growl id="messages" showSummary="true" showDetail="true" sticky="true" autoUpdate="true" />
                <p>Select the system user and enter a new password.</p>
                <p:fieldset styleClass="reallyNarrow centered single">
                    <ol>
                        <li
                            style="#{changeSystemAccountPassword.changeSystemAccountPasswordFailed ? '' : 'display: none;'} width: 100%">
                            <span style="color:red">
                                There was an error updating your password. Please try again.
                            </span>
                        </li>
                        <li>
                            <p:outputLabel for="systemUser">System User</p:outputLabel><br />
                            <p:selectOneMenu id="systemUser" value="#{changeSystemAccountPassword.username}"
                                required="true" label="System user whose password we're changing.">
                                <f:selectItem itemValue="" itemLabel="Select One" />
                                <f:selectItems value="#{changeSystemAccountPassword.systemUsers}" var="i"
                                    itemValue="#{i}" itemLabel="#{i}" />
                            </p:selectOneMenu>
                        </li>
                        <li>
                            <p:outputLabel for="password">New Password</p:outputLabel><br />
                            <p:password id="password" value="#{changeSystemAccountPassword.password}" required="true"
                                label="New password for the system user.">
                                <o:validatePassword />
                            </p:password>
                        </li>
                        <li>
                            <p:outputLabel for="confirmPassword">Confirm Password</p:outputLabel><br />
                            <p:password id="confirmPassword" value="#{changeSystemAccountPassword.password}"
                                required="true" label="Confirm the new password.">
                                <o:validatePassword />
                                <o:validateEquals to="password" />
                            </p:password>
                        </li>
                    </ol>
                    <div class="sub">
                        <p:commandButton value="Submit" ajax="false"
                            action="#{changeSystemAccountPassword.changePassword()}" />
                    </div>
                </p:fieldset>
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>

</html>
