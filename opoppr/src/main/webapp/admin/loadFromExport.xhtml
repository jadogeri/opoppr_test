<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>IGNORED</title>
    </h:head>
    <h:body>
        <ui:composition template="/templates/masterTemplate.xhtml">
            <ui:define name="contentHeading">Administration</ui:define>
            <ui:define name="content">
                <div>
                    <div style="float: left;"><h2>Load From Export</h2></div>
                    <div style="float: right"><a href="help.html" onclick="javascript:void window.open('help.html#BusinessInfo','1359749959948','width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');return false;">Help</a></div>
                </div>
                <h:form id="form" enctype="multipart/form-data" style="float: left; width: 100%">
                    <p:growl id="messages" showSummary="true" showDetail="true" sticky="true" autoUpdate="true" />
                    <p>Select the ZIP file that contains the noa_pp_lat5, noa_pp_lat_5_filing, and noa_pp_lat_5_inventories files then click submit.</p>
                    <p:fieldset styleClass="narrow centered single">
                        <ol>
                            <li>
                                <p:fileUpload id="file" value="#{loadFromExport.file}" mode="simple" dragDropSupport="false"
                                              required="true" update="messages" allowTypes="/(\.|\/)(zip)$/">
                                    <p:validateFile required="true" fileLimit="1" sizeLimit="5242880" />
                                </p:fileUpload>
                            </li>
                            <li style="width: 100%">
                                <h:selectBooleanCheckbox id="currentTaxYear" type="checkbox" value="#{loadFromExport.currentTaxYear}" />
                                <p:outputLabel for="currentTaxYear">Loading current tax year?</p:outputLabel>
                            </li>
                        </ol>
                        <div class="sub">
                            <p:commandButton value="Submit" ajax="false" action="#{loadFromExport.uploadFile()}" />
                        </div>
                    </p:fieldset>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
