<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui" xmlns:pe="http://primefaces.org/ui/extensions" xmlns:o="http://opoppr.svlogic.com/ui"
    xmlns:c="jakarta.tags.core">
<f:metadata>
    <f:event type="preRenderView" listener="#{lat5Section4.initConversation}" />
</f:metadata>
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">LAT 5</ui:define>
        <ui:define name="content">
            <ui:include src="/templates/sessionTemplate.xhtml" />
            <div>
                <div style="float: left;">
                    <h2>Section 4 - Leasehold Improvements and Miscellaneous Property</h2>
                </div>
                <div style="float: right"><a href="help.html"
                        onclick="javascript:void window.open('help.html#Section4','1359749959948','width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');return false;">Help</a>
                </div>
            </div>
            <h:form id="form" styleClass="saveForm" prependId="false" style="float: left; width: 100%">
                <p:growl id="messages" showSummary="true" showDetail="true" autoUpdate="true" sticky="true" />
                <o:disablePanel disabled="#{userSession.currentFormSubmitted}">
                    <pe:sheet id="filings" widgetVar="filingSheet" value="#{lat5Section4.filings}" var="f"
                        rowKey="#{f.sheetRowKey}" height="425" fixedRows="1" showRowHeaders="true"
                        resizableCols="true" resizableRows="true" stretchH="all" selectionMode="range"
                        emptyMessage="#{userSession.emptyTableMessage}" rowStyleClass="#{f.isValid('13') ? '' : 'error'}"
                        styleClass="opoppr-sheet" readOnly="#{userSession.currentFormSubmitted}">
                        <p:ajax event="change" update=":form:messages :form:summary" />
                        <pe:sheetcolumn headerText="Property Type" value="#{f.propertyAssetDescription}" colType="dropdown" selectItems="#{lat5Section4.propertyAssetDescriptions}" colWidth="350" />
                        <pe:sheetcolumn headerText="Item Description" value="#{f.noaPpLat5Filing.itemDescription}" colType="text" colWidth="225" />
                        <pe:sheetcolumn headerText="Year of Acquisition" value="#{f.noaPpLat5Filing.yracqd}" colType="numeric" numericLocale="en-US" numericPattern="0" colWidth="150">
                            <f:convertNumber maxFractionDigits="0" groupingUsed="false" />
                            <f:validateLongRange minimum="#{msgs.minYearOfAcquisition}" maximum="#{currentYear}" />
                        </pe:sheetcolumn>
                        <pe:sheetcolumn headerText="Acquisition Cost" value="#{f.noaPpLat5Filing.acquisitionCost}" colType="numeric" numericLocale="en-US" numericPattern="$0,0" colWidth="150">
                            <f:convertNumber maxFractionDigits="0" maxIntegerDigits="10" groupingUsed="false" />
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>

                    </pe:sheet>
                </o:disablePanel>
                <p:panelGrid id="summary" layout="grid" columns="2" styleClass="summary">
                    <p:outputLabel>Grand Total</p:outputLabel>
                    <h:outputText value="#{lat5Section4.grandTotal}">
                        <f:convertNumber type="currency" maxFractionDigits="0" />
                    </h:outputText>
                </p:panelGrid>
                <div class="submit">
                    <p:commandButton action="#{lat5Section4.addNewRow}" value="Add New Row" update="filings" rendered="#{!userSession.currentFormSubmitted}" />
                    <p:button outcome="previous" rendered="#{userSession.currentFormSubmitted}" value="Previous" />
                    <p:commandButton action="#{lat5Section4.previous()}" rendered="#{!userSession.currentFormSubmitted}"
                        value="Previous" ajax="false" styleClass="submitForm" />
                    <p:button outcome="next" value="Next" rendered="#{userSession.currentFormSubmitted}" />
                    <p:commandButton rendered="#{!userSession.currentFormSubmitted}" action="#{lat5Section4.next()}"
                        value="Next" ajax="false" styleClass="submitForm" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>

</html>
