<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets"
    xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui"
    xmlns:pe="http://primefaces.org/ui/extensions" xmlns:o="http://opoppr.svlogic.com/ui" xmlns:c="jakarta.tags.core">
<f:metadata>
    <f:event type="preRenderView" listener="#{lat5Section5.initConversation}" />
</f:metadata>
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">LAT 5</ui:define>
        <ui:define name="content">
            <h:outputScript name="lat5-sheet.js" library="js" />
            <ui:include src="/templates/sessionTemplate.xhtml" />
            <div>
                <div style="float: left;">
                    <h2>Section 5 - Consigned Goods, Leased, Loaned or Rented Equipment, Furniture, Etc.</h2>
                </div>
                <div style="float: right"><a href="help.html"
                        onclick="javascript:void window.open('help.html#Section5','1359749959948','width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');return false;">Help</a>
                </div>
            </div>
            <h:form id="form" styleClass="saveForm" prependId="false" style="float: left; width: 100%">
                <p:growl id="messages" showSummary="true" showDetail="true" autoUpdate="true" sticky="true" />
                <o:disablePanel disabled="#{userSession.currentFormSubmitted}">
                    <pe:sheet id="filings" widgetVar="filingSheet" value="#{lat5Section5.filings}" var="f"
                        rowKey="#{f.sheetRowKey}" height="425" fixedRows="1" showRowHeaders="true"
                        resizableCols="true" resizableRows="true" stretchH="all" selectionMode="range" extender="filingSheetExtender"
                        emptyMessage="#{userSession.emptyTableMessage}" rowStyleClass="#{f.isValid('99') ? '' : 'error'}"
                        styleClass="opoppr-sheet" readOnly="#{userSession.currentFormSubmitted}">
                        <p:ajax event="change" update=":form:messages" />
                        <pe:sheetcolumn headerText="Property Description" value="#{f.noaPpLat5Filing.itemDescription}" colType="text" colWidth="165" />
                        <pe:sheetcolumn headerText="Owner Name" value="#{f.noaPpLat5Filing.consignerOwnerName}" colType="text" colWidth="160" />
                        <pe:sheetcolumn headerText="Owner Address" value="#{f.noaPpLat5Filing.consignerMailingAddr}" colType="text" colWidth="225" />
                        <pe:sheetcolumn headerText="Owner Phone #" value="#{f.noaPpLat5Filing.consignerTelNo}" colType="text" colWidth="135" />
                        <pe:sheetcolumn headerText="Age of Property" value="#{f.noaPpLat5Filing.effectiveLife}" colType="numeric" numericLocale="en-US" numericPattern="0" colWidth="110">
                            <f:convertNumber maxIntegerDigits="3" maxFractionDigits="0" />
                            <f:validateLongRange minimum="0" maximum="999" />
                        </pe:sheetcolumn>
                        <pe:sheetcolumn headerText="Monthly Rental" value="#{f.noaPpLat5Filing.consignerRentalAmt}" colType="numeric" numericLocale="en-US" numericPattern="$0,0" colWidth="145">
                            <f:convertNumber maxFractionDigits="0" maxIntegerDigits="10" groupingUsed="false" />
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>

                    </pe:sheet>
                </o:disablePanel>
                <div class="submit">
                    <p:commandButton id="addRowButton" styleClass="sheet-add-row" action="#{lat5Section5.addNewRow}" value="Add New Row" update="filings" rendered="#{!userSession.currentFormSubmitted}" />
                    <p:button outcome="previous" rendered="#{userSession.currentFormSubmitted}" value="Previous" />
                    <p:commandButton action="#{lat5Section5.previous()}" rendered="#{!userSession.currentFormSubmitted}"
                        value="Previous" ajax="false" styleClass="submitForm" />
                    <p:button outcome="next" value="Next" rendered="#{userSession.currentFormSubmitted}" />
                    <p:commandButton rendered="#{!userSession.currentFormSubmitted}" action="#{lat5Section5.next()}"
                        value="Next" ajax="false" styleClass="submitForm" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>

</html>
