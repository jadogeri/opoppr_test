<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui" xmlns:pe="http://primefaces.org/ui/extensions" xmlns:o="http://opoppr.svlogic.com/ui"
    xmlns:c="jakarta.tags.core">
<f:metadata>
    <f:event type="preRenderView" listener="#{lat5Section3.initConversation}" />
</f:metadata>
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">LAT 5</ui:define>
        <ui:define name="content">
            
            <!-- FIXED CSS LOCATION: Embedded style tags must live inside ui:define tags to append safely to the rendered view -->
            <style type="text/css">
                /* Targets any sheet column marked with our custom grid-error class */
                .opoppr-sheet td.grid-error {
                    background-color: #fce8e6 !important; /* Soft light-red */
                    border-left: 3px solid #d93025 !important; /* Dark red left indicator border */
                }
                
                /* Handles native handsontable validation failure styling seamlessly */
                .opoppr-sheet td.htInvalid {
                    background-color: #fce8e6 !important;
                    border-left: 3px solid #d93025 !important;
                }
            </style>

            <ui:include src="/templates/sessionTemplate.xhtml" />
            <div>
                <div style="float: left;">
                    <h2>Section 3 - Machinery and Equipment</h2>
                </div>
                <div style="float: right"><a href="help.html"
                        onclick="javascript:void window.open('help.html#Section3','1359749959948','width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');return false;">Help</a>
                </div>
            </div>
            <h:form id="form" styleClass="saveForm" prependId="false" style="float: left; width: 100%">
                <p:growl id="messages" showSummary="true" showDetail="true" autoUpdate="true" sticky="true" />
                <o:disablePanel disabled="#{userSession.currentFormSubmitted}">
                    
                    <!-- REMOVED: rowStyleClass error flag since cell renderers override row-level tags -->
                    <pe:sheet id="filings" widgetVar="filingSheet" value="#{lat5Section3.filings}" var="f"
                        rowKey="#{f.sheetRowKey}" height="425" fixedRows="1" showRowHeaders="true"
                        resizableCols="true" resizableRows="true" stretchH="all" selectionMode="range"
                        emptyMessage="#{userSession.emptyTableMessage}"
                        styleClass="opoppr-sheet" readOnly="#{userSession.currentFormSubmitted}">
                        
                        <!-- FIXED: Added process="filings" to pass cell arrays cleanly during changes -->
                        <p:ajax event="change" process="filings" update=":form:messages :form:summary" />
                        
                        <pe:sheetcolumn headerText="Property Type" value="#{f.propertyAssetDescription}" colType="dropdown" selectItems="#{lat5Section3.propertyAssetDescriptions}" colWidth="475" />
                        
                        <!-- FIXED EXPRESSION: Checking for empty AND primitive 0 value to reliably capture blank inputs across integer types for Section Code 10 -->
                        <pe:sheetcolumn headerText="Year of Acquisition" value="#{f.noaPpLat5Filing.yracqd}" 
                                        styleClass="#{(!f.isValid('10') and (empty f.noaPpLat5Filing.yracqd or f.noaPpLat5Filing.yracqd eq 0)) ? 'grid-error' : ''}"
                                        colType="numeric" numericLocale="en-US" numericPattern="0" colWidth="150">
                            <f:convertNumber maxFractionDigits="0" groupingUsed="false" />
                            <f:validateLongRange minimum="#{msgs.minYearOfAcquisition}" maximum="#{currentYear}" />
                        </pe:sheetcolumn>
                        
                        <!-- FIXED EXPRESSION: Checking for empty AND primitive 0 value to reliably capture blank inputs across monetary types for Section Code 10 -->
                        <pe:sheetcolumn headerText="Acquisition Cost" value="#{f.noaPpLat5Filing.acquisitionCost}" 
                                        styleClass="#{(!f.isValid('10') and (empty f.noaPpLat5Filing.acquisitionCost or f.noaPpLat5Filing.acquisitionCost eq 0)) ? 'grid-error' : ''}"
                                        colType="numeric" numericLocale="en-US" numericPattern="$#,##0" colWidth="150">
                            <f:convertNumber maxFractionDigits="0" maxIntegerDigits="10" groupingUsed="false" />
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>

                    </pe:sheet>
                </o:disablePanel>
                <p:panelGrid id="summary" layout="grid" columns="2" styleClass="summary">
                    <p:outputLabel>Grand Total</p:outputLabel>
                    <h:outputText value="#{lat5Section3.grandTotal}">
                        <f:convertNumber type="currency" maxFractionDigits="0" />
                    </h:outputText>
                </p:panelGrid>
                <div class="submit">
                    <p:commandButton action="#{lat5Section3.addNewRow}" value="Add New Row" update="filings" rendered="#{!userSession.currentFormSubmitted}" />
                    <p:button outcome="previous" rendered="#{userSession.currentFormSubmitted}" value="Previous" />
                    <p:commandButton action="#{lat5Section3.previous()}" rendered="#{!userSession.currentFormSubmitted}"
                        value="Previous" ajax="false" styleClass="submitForm" />
                    <p:button outcome="next" value="Next" rendered="#{userSession.currentFormSubmitted}" />
                    <p:commandButton rendered="#{!userSession.currentFormSubmitted}" action="#{lat5Section3.next()}"
                        value="Next" ajax="false" styleClass="submitForm" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>

</html>
