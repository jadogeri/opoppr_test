<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui" xmlns:pe="http://primefaces.org/ui/extensions" xmlns:o="http://opoppr.svlogic.com/ui"
    xmlns:c="jakarta.tags.core">
<f:metadata>
    <f:event type="preRenderView" listener="#{lat5Section1.initConversation}" />
</f:metadata>
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">LAT 5</ui:define>
        <ui:define name="content">
            <h:outputScript name="lat5-sheet.js" library="js" />
            <ui:include src="/templates/sessionTemplate.xhtml" />
            <div>
                <div style="float: left;">
                    <h2>Section 1 - Inventories / Merchandise and Cost of Goods Used</h2>
                </div>
                <div style="float: right"><a href="help.html"
                        onclick="javascript:void window.open('help.html#Section1','1359749959948','width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');return false;">Help</a>
                </div>
            </div>
            <h:form id="form" styleClass="saveForm" prependId="false" style="float: left; width: 100%">
                <p:growl id="messages" showSummary="true" showDetail="true" autoUpdate="true" sticky="true" />
                <o:disablePanel disabled="#{userSession.currentFormSubmitted}">
                    <pe:sheet id="items" widgetVar="itemsSheet" value="#{lat5Section1.inventoryRows}" var="ir"
                        rowKey="#{ir.monthName}" height="425" fixedRows="1" fixedCols="1" showRowHeaders="true"
                        resizableCols="true" resizableRows="true" stretchH="all" selectionMode="range" extender="inventorySheetExtender"
                        styleClass="opoppr-sheet" readOnly="#{userSession.currentFormSubmitted}">
                        <p:ajax event="change" update=":form:messages :form:summary" />
                        
                        <pe:sheetcolumn headerText="Month" value="#{ir.monthName}" readOnly="true" colWidth="125" />
                        
                        <pe:sheetcolumn headerText="Merchandise" value="#{ir.data['01'].inventoryAmt}" colType="numeric"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="145">
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>
                        
                        <pe:sheetcolumn headerText="Raw Materials" value="#{ir.data['02'].inventoryAmt}" colType="numeric"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="145">
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>
                        
                        <pe:sheetcolumn headerText="Work In Process" value="#{ir.data['03'].inventoryAmt}" colType="numeric"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="145">
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>
                        
                        <pe:sheetcolumn headerText="Finished Goods" value="#{ir.data['04'].inventoryAmt}" colType="numeric"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="145">
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>
                        
                        <pe:sheetcolumn headerText="Supplies And/Or Goods Used" value="#{ir.data['05'].inventoryAmt}" colType="numeric"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="190">
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>
                        
                        <pe:sheetcolumn headerText="Other" value="#{ir.data['99'].inventoryAmt}" colType="numeric"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="125">
                            <f:validateLongRange minimum="0" maximum="9999999999" />
                        </pe:sheetcolumn>
                        
                        <pe:sheetcolumn headerText="Total" value="#{ir.total}" colType="numeric" readOnly="true"
                            numericLocale="en-US" numericPattern="$0,000" colWidth="135">
                        </pe:sheetcolumn>
                    </pe:sheet>
                </o:disablePanel>
                
                <p:panelGrid id="summary" layout="grid" columns="2" styleClass="summary">
                    <p:outputLabel>Grand Total</p:outputLabel>
                    <h:outputText value="#{lat5Section1.grandTotal}">
                        <f:convertNumber type="currency" maxFractionDigits="0"/>
                    </h:outputText>
                    <p:outputLabel>Average</p:outputLabel>
                    <h:outputText value="#{lat5Section1.average}">
                        <f:convertNumber type="currency" maxFractionDigits="0"/>
                    </h:outputText>
                </p:panelGrid>
                
                <div class="submit">
                    <p:button outcome="previous" rendered="#{userSession.currentFormSubmitted}" value="Previous" />
                    <p:commandButton action="#{lat5Section1.previous()}" rendered="#{!userSession.currentFormSubmitted}"
                        value="Previous" styleClass="submitForm" ajax="false" onclick2="" />
                    <p:button outcome="next" value="Next" rendered="#{userSession.currentFormSubmitted}" />
                    <p:commandButton rendered="#{!userSession.currentFormSubmitted}" action="#{lat5Section1.next()}"
                        value="Next" styleClass="submitForm" ajax="false" onclick2="" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>
</html>
