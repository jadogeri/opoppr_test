<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui" xmlns:o="http://opoppr.svlogic.com/ui" xmlns:c="jakarta.tags.core"
    xmlns:f="jakarta.faces.core">
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">Create User Account</ui:define>
        <ui:define name="content">
            <h:form id="form" prependId="false">
                <p:focus />
                <p:growl id="messages" showSummary="true" showDetail="true" sticky="true" autoUpdate="true" />
                <p:fieldset id="fieldset" styleClass="medium centered single">
                    <ol>
                        <li style="width: 100%; #{createUserAccount.createUserAccountFailed ? '' : 'display: none;'}">
                            <span style="color:red">
                                You have entered an Email Address that already exists in the database.
                            </span>
                        </li>
                        <li>
                            <p:outputLabel for="emailAddress">Email Address</p:outputLabel>
                            <p:inputText id="emailAddress" label="Email Address" size="50" maxlength="75"
                                value="#{createUserAccount.emailAddress}" required="true" placeholder="user@email.com">
                                <f:validateLength maximum="75" />
                                <o:validateEmail />
                            </p:inputText>
                        </li>
                        <li>
                            <p:outputLabel for="confirmEmailAddress">Confirm Email Address</p:outputLabel>
                            <p:inputText id="confirmEmailAddress" label="Confirm Email Address" size="50" maxlength="75"
                                value="#{createUserAccount.emailAddress}" required="true">
                                <f:validateLength maximum="75" />
                                <o:validateEmail />
                                <o:validateEquals to="emailAddress" />
                            </p:inputText>
                        </li>
                        <li>
                            <p:outputLabel for="password">Password</p:outputLabel><br />
                            <p:tooltip for="password" showEvent="focus" hideEvent="blur" position="right" escape="false"
                                value="#{msgs.passwordHint}" />
                            <p:password required="true" label="Password" id="password" size="32" maxlength="32"
                                value="#{createUserAccount.password}" alt="hint">
                                <o:validatePassword />
                            </p:password>
                        </li>
                        <li style="width: 100%">
                            <p:outputLabel for="confirmPassword">Confirm Password</p:outputLabel>
                            <p:tooltip for="confirmPassword" showEvent="focus" hideEvent="blur" position="right"
                                escape="false" value="#{msgs.passwordHint}" />
                            <p:password required="true" label="Confirm Password" id="confirmPassword" size="32"
                                maxlength="32" value="#{createUserAccount.password}">
                                <o:validatePassword />
                                <o:validateEquals to="password" />
                            </p:password>
                        </li>
                        <li>
                            <p:outputLabel for="fullName">Full Name</p:outputLabel>
                            <p:inputText required="true" label="Full Name" id="fullName" size="50" maxlength="50"
                                value="#{createUserAccount.fullName}" />
                        </li>
                        <li>
                            <p:outputLabel for="phoneNumber">Phone Number</p:outputLabel>
                            <p:inputMask id="phoneNumber" mask="(999) 999-9999" label="PhoneNumber" size="14"
                                maxlength="14" value="#{createUserAccount.phoneNumber}" required="true">
                                <o:convertMask mask="(###) ###-####" />
                                <o:validatePhoneNumber />
                            </p:inputMask>
                        </li>
                    </ol>
                    <div class="sub">
                        <p:commandButton value="Submit" action="#{createUserAccount.createAccount()}" ajax="false" />
                    </div>
                </p:fieldset>
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>

</html>
