<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:o="http://opoppr.svlogic.com/ui"
    xmlns:c="jakarta.tags.core" xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="verificationCode" value="#{resetPassword.verificationCode}" />
</f:metadata>
<h:head>
    <title>IGNORED</title>
</h:head>
<h:body>
    <ui:composition template="/templates/masterTemplate.xhtml">
        <ui:define name="contentHeading">Reset Password</ui:define>
        <ui:define name="content">
            <div style="float: right"><a href="help.html"
                    onclick="javascript:void window.open('forms/LAT5/help.html#Login','1359749959948','width=600,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1');return false;">Help</a>
            </div>
            <h:form id="form" prependId="false">
                <p:focus />
                <p:growl id="messages" showSummary="true" showDetail="true" sticky="true" autoUpdate="true" />
                <p:fieldset id="fieldset" styleClass="narrow centered single">
                    <div style="#{resetPassword.checkVerificationCode() == 1 ? '' : 'display: none;'}">
                        <ol>
                            <li style="#{resetPassword.resetPasswordFailed ? '' : 'display: none;'} width: 100%">
                                <span style="color:red">
                                    There was an error updating your password. Please try again.
                                </span>
                            </li>
                            <li style="width: 100%">
                                <p:outputLabel for="password">New Password</p:outputLabel>
                                <p:tooltip for="password" showEvent="focus" hideEvent="blur" position="right"
                                    escape="false" value="#{msgs.passwordHint}" />
                                <p:password required="true" label="Password" id="password" size="32" maxlength="32"
                                    value="#{createUserAccount.password}">
                                    <o:validatePassword />
                                </p:password>
                            </li>
                            <li style="width: 100%">
                                <p:outputLabel for="confirmPassword">Confirm New Password</p:outputLabel>
                                <p:tooltip for="confirmPassword" showEvent="focus" hideEvent="blur" position="right" escape="false" value="#{msgs.passwordHint}" />
                                <p:password required="true" label="Confirm New Password" id="confirmPassword" size="32"
                                    maxlength="32" value="#{resetPassword.password}">
                                    <o:validatePassword />
                                    <o:validateEquals to="password" />
                                </p:password>
                            </li>
                        </ol>
                        <div class="sub">
                            <p:commandButton value="Submit" action="#{resetPassword.resetPassword()}" ajax="false" />
                        </div>
                    </div>
                    <div style="#{resetPassword.checkVerificationCode() == -1 ? '' : 'display: none;'}">
                        <ol>
                            <li>
                                <h:outputText
                                    value="The verification code has expired.  Please click the button to have a new verification code emailed to you." />
                            </li>
                        </ol>
                        <div class="sub">
                            <p:commandButton value="Resend Verification Code"
                                action="#{resetPassword.resendVerificationCode()}" ajax="false" immediate="true" />
                        </div>
                    </div>
                    <div style="#{resetPassword.checkVerificationCode() == 0 ? '' : 'display: none;'}">
                        <ol>
                            <li>
                                <h:outputText value="The verification code is invalid." />
                            </li>
                        </ol>
                        <div class="sub">
                            <p:button value="Back to Login" outcome="login" ajax="false" />
                        </div>
                    </div>
                </p:fieldset>
                <p:inputText id="verificationCode" value="#{resetPassword.verificationCode}" type="hidden" />
            </h:form>
        </ui:define>
    </ui:composition>
</h:body>

</html>
