<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:o="http://opoppr.svlogic.com/ui"
      xmlns:c="jakarta.tags.core"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>IGNORED</title>
    </h:head>
    <h:body>
        <ui:composition template="/templates/masterTemplate.xhtml">
            <ui:define name="contentHeading">Forgot Password</ui:define>
            <ui:define name="content">
                <h:form id="form" prependId="false">
                    <p:focus />
                    <p:growl id="messages" showSummary="true" showDetail="true" sticky="true" autoUpdate="true" />
                    <p:fieldset id="fieldset" styleClass="narrow centered single">
                        <ol>
                            <c:if test="#{forgotPassword.resetPasswordRequestFailed}">
                                <li style="width: 100%">
                                    <span style="color:red">
                                        You have entered an invalid Email Address.
                                    </span>
                                </li>
                            </c:if>
                            <li>
                                <p:outputLabel for="emailAddress">Email Address</p:outputLabel>
                                <p:inputText id="emailAddress" label="Email" size="50" maxlength="75" value="#{forgotPassword.emailAddress}" required="true">
                                    <f:validateLength maximum="75" />
                                    <o:validateEmail />
                                </p:inputText>
                            </li>
                        </ol>
                        <div class="sub">
                            <p:commandButton value="Submit" action="#{forgotPassword.submitResetPasswordRequest()}" ajax="false" />
                        </div>
                    </p:fieldset>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
